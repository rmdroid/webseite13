      text{font-family:Inter,Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace;font-size:17px;letter-spacing:0}.label{font-size:24px;font-weight:760}.small{font-size:17px}
    </style>
  </defs>
  <rect width="760" height="520" rx="10" class="bg"/>
  <rect x="48" y="44" width="664" height="432" rx="18" class="paper" stroke="#d8d0c2" stroke-width="2"/>
  <text x="84" y="92" class="mono muted">ARBEITSMODELL</text>
  <text x="84" y="130" class="label ink">Code statt PowerPoints</text>
  <g transform="translate(270 176)">
