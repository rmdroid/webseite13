<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Robert Meyer Arbeitsmodell</title>
  <desc id="desc">Arbeitsmodell Code statt PowerPoints mit Diagnose, Compliance, Workflow und Schulung</desc>
  <defs>
