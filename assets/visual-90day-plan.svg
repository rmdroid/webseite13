<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">30 60 90 day plan visual</title>
  <desc id="desc">Roadmap visual with 30, 60 and 90 day milestones.</desc>
  <rect width="760" height="520" rx="18" fill="#fffdf8"/>
  <rect x="48" y="50" width="664" height="420" rx="16" fill="#f2efe7" stroke="#d8d0c2"/>
  <text x="90" y="100" font-family="Menlo,monospace" font-size="16" fill="#a85d32">30 / 60 / 90 PLAN</text>
  <path d="M116 290h528" stroke="#191713" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Inter,Arial,sans-serif">
    <circle cx="160" cy="290" r="34" fill="#191713"/>
    <text x="160" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#fffdf8">30</text>
    <text x="160" y="368" text-anchor="middle" font-size="18" font-weight="700" fill="#171512">Check</text>
    <text x="160" y="394" text-anchor="middle" font-size="14" fill="#6f685e">decision</text>
    <circle cx="380" cy="290" r="34" fill="#a85d32"/>
    <text x="380" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#fffdf8">60</text>
    <text x="380" y="368" text-anchor="middle" font-size="18" font-weight="700" fill="#171512">Prototype</text>
    <text x="380" y="394" text-anchor="middle" font-size="14" fill="#6f685e">workflow</text>
    <circle cx="600" cy="290" r="34" fill="#3c7a5f"/>
    <text x="600" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#fffdf8">90</text>
    <text x="600" y="368" text-anchor="middle" font-size="18" font-weight="700" fill="#171512">Operate</text>
    <text x="600" y="394" text-anchor="middle" font-size="14" fill="#6f685e">govern</text>
  </g>
</svg>
