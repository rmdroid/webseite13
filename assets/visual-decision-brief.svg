  <rect width="760" height="520" rx="18" fill="#fffdf8"/>
  <rect x="46" y="42" width="668" height="436" rx="16" fill="#f2efe7" stroke="#d8d0c2"/>
  <rect x="88" y="82" width="584" height="356" rx="10" fill="#fffdf8" stroke="#d8d0c2"/>
  <text x="118" y="126" font-family="Menlo,monospace" font-size="16" fill="#a85d32">DECISION BRIEF</text>
  <text x="118" y="178" font-family="Georgia,serif" font-size="46" font-weight="700" fill="#171512">Build / Hold / Stop</text>
